<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0d12" />
  <title>Obito X Archive</title>
  <style>
    :root{
      --bg:#090b0f;
      --panel:#101319;
      --panel-2:#0d1016;
      --border:rgba(255,255,255,.075);
      --muted:#7f8798;
      --text:#f4f6fb;
      --accent:#7b5cff;
      --accent-2:#9c62ff;
      --cyan:#58a6ff;
      --shadow:0 24px 70px rgba(0,0,0,.35);
      --radius:22px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      color:var(--text);
      background:
        radial-gradient(800px 420px at 50% 10%, rgba(91,72,173,.10), transparent 65%),
        linear-gradient(180deg,#0b0d12 0%,#090b0f 100%);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    button,input,select{font:inherit}
    button{color:inherit}
    .container{width:min(1180px,calc(100% - 48px));margin:auto}
    header{
      height:88px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .brand{display:flex;align-items:center;gap:13px;font-weight:800;font-size:21px}
    .logo{
      width:42px;height:42px;border-radius:13px;
      display:grid;place-items:center;
      background:linear-gradient(145deg,#6e55ff,#a85cff);
      box-shadow:0 10px 35px rgba(117,77,255,.35);
      font-size:20px;
    }
    .actions{display:flex;gap:12px}
    .btn{
      border:1px solid var(--border);
      background:rgba(17,20,27,.72);
      border-radius:13px;
      padding:11px 18px;
      cursor:pointer;
      font-weight:700;
      transition:.2s ease;
    }
    .btn:hover{transform:translateY(-1px);border-color:rgba(126,91,255,.45)}
    .btn.primary{border-color:rgba(105,85,255,.45);color:#9d8dff}
    .hero{text-align:center;padding:34px 0 58px}
    .hero h1{
      margin:0;
      font-size:clamp(48px,7vw,76px);
      line-height:.95;
      letter-spacing:-4px;
      font-weight:900;
      background:linear-gradient(180deg,#fff 0%,#aeb3c2 100%);
      -webkit-background-clip:text;background-clip:text;color:transparent;
    }
    .hero p{color:#6ea7ed;font-size:18px;margin:22px 0 28px}
    .stats{
      display:inline-flex;gap:28px;padding:14px 24px;
      border:1px solid var(--border);border-radius:999px;
      background:rgba(17,19,26,.75);box-shadow:var(--shadow)
    }
    .stat{display:flex;gap:9px;align-items:center;color:#8d96a9;font-size:14px}
    .stat strong{color:#f4f5f9}
    .dot{color:#6c5dff}
    .controls{
      border:1px solid var(--border);border-radius:22px;
      background:rgba(15,18,24,.72);padding:22px;
      box-shadow:var(--shadow);backdrop-filter:blur(12px);
    }
    .search{
      display:flex;align-items:center;gap:13px;
      height:56px;border:1px solid var(--border);border-radius:16px;
      padding:0 18px;background:#0d0f14;
    }
    .search svg{width:20px;color:#61708b;flex:none}
    .search input{width:100%;border:0;outline:0;background:transparent;color:white;font-size:14px}
    .search input::placeholder{color:#656d7d}
    .filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
    .pill{
      border:1px solid var(--border);background:#15181f;color:#8c95a8;
      padding:10px 16px;border-radius:12px;font-size:12px;font-weight:800;
      cursor:pointer;transition:.2s ease
    }
    .pill:hover{border-color:#6754e8;color:#c9c4ff}
    .pill.active{
      color:white;border-color:transparent;
      background:linear-gradient(135deg,#6d55ff,#9d56ff);
      box-shadow:0 8px 24px rgba(106,75,255,.28)
    }
    .selects{display:flex;gap:10px;margin-top:18px}
    select{
      appearance:none;border:1px solid var(--border);background:#0d1015;color:#a6adbc;
      border-radius:12px;padding:10px 40px 10px 14px;outline:0;
      background-image:linear-gradient(45deg,transparent 50%,#697387 50%),linear-gradient(135deg,#697387 50%,transparent 50%);
      background-position:calc(100% - 18px) 15px,calc(100% - 13px) 15px;
      background-size:5px 5px,5px 5px;background-repeat:no-repeat
    }
    .grid{
      display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
      gap:24px;margin:34px 0 70px
    }
    .card{
      overflow:hidden;border:1px solid var(--border);border-radius:20px;
      background:linear-gradient(180deg,#11141b,#0d1015);
      box-shadow:0 18px 55px rgba(0,0,0,.24);
      transition:.22s ease;cursor:pointer
    }
    .card:hover{transform:translateY(-5px);border-color:rgba(122,93,255,.35)}
    .thumb{
      height:176px;position:relative;overflow:hidden;
      background:
        radial-gradient(circle at 70% 35%,rgba(126,92,255,.32),transparent 35%),
        linear-gradient(135deg,#18202c,#11141c 60%,#15102a);
    }
    .thumb:before{
      content:"";position:absolute;inset:14px;
      border:1px solid rgba(255,255,255,.06);border-radius:12px;
      background:linear-gradient(90deg,rgba(74,85,110,.15) 1px,transparent 1px),linear-gradient(rgba(74,85,110,.15) 1px,transparent 1px);
      background-size:22px 22px;opacity:.8
    }
    .fake-ui{
      position:absolute;left:13%;right:13%;top:22px;bottom:20px;
      border:1px solid rgba(255,255,255,.10);border-radius:9px;
      background:rgba(8,11,16,.78);box-shadow:0 15px 35px rgba(0,0,0,.4);
      padding:12px
    }
    .fake-bar{height:8px;width:38%;background:#7661ff;border-radius:5px;margin-bottom:12px}
    .fake-row{height:8px;margin:8px 0;border-radius:5px;background:linear-gradient(90deg,#30384a 0 60%,#6356b4 60% 75%,#252b37 75%)}
    .fake-row.short{width:75%}
    .badge{
      position:absolute;top:14px;right:14px;padding:6px 9px;border-radius:8px;
      background:rgba(7,9,13,.72);border:1px solid rgba(255,255,255,.09);
      font-size:10px;color:#9ba4b7
    }
    .card-body{padding:18px}
    .card h3{font-size:16px;margin:0 0 11px;font-weight:850}
    .tags{display:flex;gap:7px;flex-wrap:wrap}
    .tag{
      padding:5px 9px;border-radius:999px;background:#191d25;border:1px solid rgba(255,255,255,.05);
      color:#8e98aa;font-size:10px;font-weight:800;text-transform:uppercase
    }
    .desc{font-size:12px;color:#6e7789;margin:13px 0 0;line-height:1.55}
    .empty{text-align:center;color:#6f7889;padding:55px 0;display:none;grid-column:1/-1}
    footer{border-top:1px solid var(--border);padding:25px 0 40px;color:#5f6879;font-size:12px;text-align:center}
    .modal{
      position:fixed;inset:0;background:rgba(2,3,6,.74);backdrop-filter:blur(10px);
      display:none;place-items:center;padding:20px;z-index:10
    }
    .modal.open{display:grid}
    .dialog{
      width:min(560px,100%);border:1px solid var(--border);border-radius:22px;
      background:#101319;box-shadow:0 30px 100px rgba(0,0,0,.6);padding:24px
    }
    .dialog-head{display:flex;justify-content:space-between;align-items:start;gap:20px}
    .close{border:0;background:#191c24;width:36px;height:36px;border-radius:10px;cursor:pointer}
    .dialog h2{margin:0 0 8px}.dialog p{color:#8992a3;line-height:1.6}
    .dialog .download{
      width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;
      background:linear-gradient(135deg,#6d55ff,#9d56ff);font-weight:800;cursor:pointer
    }
    @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:650px){
      .container{width:min(100% - 24px,1180px)} header{height:74px}
      .actions .btn:first-child{display:none}.hero{padding-top:30px}.hero h1{letter-spacing:-2px}
      .grid{grid-template-columns:1fr}.thumb{height:190px}.controls{padding:15px}
    }
  </style>
</head>
<body>
  <header class="container">
    <div class="brand"><div class="logo">✦</div><span>Obito X Cheat</span></div>
    <div class="actions">
      <button class="btn primary" onclick="window.open('https://discord.com/','_blank')">◉ Discord</button>
      <button class="btn">🔒 Admin</button>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Obito X Archive</h1>
      <p>Obito X Cheat's Archive</p>
      <div class="stats">
        <div class="stat">▣ <span>Total:</span> <strong id="total">0</strong></div>
        <div class="stat"><span class="dot">◉</span> <span>Visible:</span> <strong id="visible">0</strong></div>
      </div>
    </section>

    <section class="controls">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="search" type="search" placeholder="Search client name or description..." />
      </label>
      <div class="filters" id="categories"></div>
      <div class="selects">
        <select id="version"><option value="all">All Versions</option></select>
        <select id="sort">
          <option value="newest">Sort: Newest</option>
          <option value="oldest">Sort: Oldest</option>
          <option value="name">Sort: Name</option>
        </select>
      </div>
    </section>

    <section class="grid" id="grid"></section>
    <div class="empty" id="empty">No archive entries match your filters.</div>
  </main>

  <footer>Obito X Archive · Static GitHub Pages template</footer>

  <div class="modal" id="modal">
    <div class="dialog">
      <div class="dialog-head">
        <div><h2 id="modalTitle"></h2><div class="tags" id="modalTags"></div></div>
        <button class="close" onclick="closeModal()">✕</button>
      </div>
      <p id="modalDesc"></p>
      <button class="download" onclick="alert('Connect this button to your own release/download URL.')">Open Release</button>
    </div>
  </div>

  <script>
    const clients = [
      {name:"Raven B4 Archive",category:"Injector",version:"1.8.9",date:"2026-10-14",desc:"Archived client interface and release information.",accent:"purple"},
      {name:"Dgkis External",category:"Injector",version:"1.21.11",date:"2026-10-12",desc:"External client archive entry with metadata and notes.",accent:"blue"},
      {name:"Prestige UI",category:"Injector",version:"1.21.11",date:"2026-10-10",desc:"Clean settings-focused interface archive.",accent:"violet"},
      {name:"Fabric Classic",category:"Fabric",version:"1.20.1",date:"2026-10-07",desc:"Legacy Fabric archive entry.",accent:"green"},
      {name:"Forge Legacy",category:"Forge",version:"1.8.9",date:"2026-10-04",desc:"Older Forge-compatible archive entry.",accent:"orange"},
      {name:"Neo Archive",category:"NeoForge",version:"1.21.1",date:"2026-09-29",desc:"NeoForge archive metadata.",accent:"cyan"},
      {name:"Quilt Base",category:"Quilt",version:"1.20.4",date:"2026-09-21",desc:"Quilt archive entry.",accent:"pink"},
      {name:"LiteLoader Legacy",category:"LiteLoader",version:"1.8.9",date:"2026-09-18",desc:"LiteLoader legacy archive entry.",accent:"purple"},
      {name:"Rift Collection",category:"Rift",version:"1.13",date:"2026-09-10",desc:"Rift-era archive entry.",accent:"blue"}
    ];

    const categories = ["All Categories", ...new Set(clients.map(x=>x.category))];
    let selectedCategory="All Categories";

    const $ = s => document.querySelector(s);
    const grid=$("#grid");

    categories.forEach(cat=>{
      const b=document.createElement("button");
      b.className="pill"+(cat===selectedCategory?" active":"");
      b.textContent=cat;
      b.onclick=()=>{selectedCategory=cat;document.querySelectorAll(".pill").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()};
      $("#categories").appendChild(b);
    });

    [...new Set(clients.map(x=>x.version))].sort().forEach(v=>{
      const o=document.createElement("option");o.value=v;o.textContent=v;$("#version").appendChild(o);
    });

    function render(){
      const q=$("#search").value.trim().toLowerCase();
      const version=$("#version").value;
      const sort=$("#sort").value;
      let list=clients.filter(c=>{
        const text=(c.name+" "+c.desc+" "+c.category+" "+c.version).toLowerCase();
        return (selectedCategory==="All Categories"||c.category===selectedCategory)
          && (version==="all"||c.version===version)
          && (!q||text.includes(q));
      });
      list.sort((a,b)=> sort==="name" ? a.name.localeCompare(b.name) :
        sort==="oldest" ? a.date.localeCompare(b.date) : b.date.localeCompare(a.date));
      $("#total").textContent=clients.length;
      $("#visible").textContent=list.length;
      $("#empty").style.display=list.length?"none":"block";
      grid.innerHTML=list.map(c=>`
        <article class="card" onclick='openModal(${JSON.stringify(c)})'>
          <div class="thumb">
            <span class="badge">${c.version}</span>
            <div class="fake-ui">
              <div class="fake-bar"></div>
              <div class="fake-row"></div><div class="fake-row short"></div>
              <div class="fake-row"></div><div class="fake-row short"></div>
            </div>
          </div>
          <div class="card-body">
            <h3>${escapeHtml(c.name)}</h3>
            <div class="tags"><span class="tag">${escapeHtml(c.category)}</span><span class="tag">${escapeHtml(c.version)}</span></div>
            <p class="desc">${escapeHtml(c.desc)}</p>
          </div>
        </article>`).join("");
    }
    function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
    function openModal(c){
      $("#modalTitle").textContent=c.name;
      $("#modalDesc").textContent=c.desc+" Version: "+c.version+".";
      $("#modalTags").innerHTML=`<span class="tag">${c.category}</span><span class="tag">${c.version}</span>`;
      $("#modal").classList.add("open");
    }
    function closeModal(){$("#modal").classList.remove("open")}
    $("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
    $("#search").addEventListener("input",render);
    $("#version").addEventListener("change",render);
    $("#sort").addEventListener("change",render);
    render();
  </script>
</body>
</html>
